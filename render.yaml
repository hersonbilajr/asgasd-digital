services:
  - type: web
    name: asgasd-digital
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render fornece a URI postgres:// completa; a aplicacao converte-a para JDBC no arranque.
      - key: DATABASE_URL
        fromDatabase:
          name: asgasd-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@asgasd.co.mz
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CLIENTE_PASSWORD
        generateValue: true

databases:
  - name: asgasd-db
    databaseName: asgasd
    user: asgasd
    plan: basic-256mb
