<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro | Asgasd Digital</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark navbar-asgasd">
    <div class="container">
        <a class="marca-asgasd" th:href="@{/}">
            <img th:src="@{/img/logo-mark.svg}" alt="Asgasd Digital" width="38" height="38">
            <span>asgasd<span class="ponto">.</span>digital</span>
        </a>
        <a class="btn btn-sm btn-claro ms-auto" th:href="@{/produtos}">Catalogo</a>
    </div>
</nav>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <div class="cartao-form">
                    <div class="display-4 fw-bold texto-acento mb-2" th:text="${codigo} ?: '404'">404</div>
                    <h1 class="h4" th:text="${titulo} ?: 'Pagina nao encontrada'">Pagina nao encontrada</h1>
                    <p class="texto-suave" th:text="${mensagem} ?: 'O endereco pedido nao existe ou foi removido.'">
                        Mensagem
                    </p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a class="btn btn-azul" th:href="@{/}"><i class="bi bi-house me-1"></i>Pagina inicial</a>
                        <a class="btn btn-contorno" th:href="@{/produtos}">Ver catalogo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="rodape">
    <div class="container">
        <div class="rodape-linha d-flex flex-wrap justify-content-between gap-2">
            <span>&copy; Asgasd Digital. Todos os direitos reservados.</span>
            <a th:href="@{/contacto}">Contactar suporte</a>
        </div>
    </div>
</footer>
</body>
</html>
