<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<main class="auth-wrapper">
    <div class="container">
        <div class="cartao-form">
            <div class="text-center mb-4">
                <img th:src="@{/img/logo-mark.svg}" alt="Asgasd Digital" width="56" height="56" class="mb-2">
                <h1 class="h4 mb-1">Criar conta na Asgasd Digital</h1>
                <p class="texto-suave small mb-0">Leva menos de um minuto. Os dados ficam guardados na sua conta.</p>
            </div>

            <form th:action="@{/auth/registo}" th:object="${registo}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome completo</label>
                    <input class="form-control" id="nome" th:field="*{nome}" autocomplete="name"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" th:field="*{email}" autocomplete="email"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="telefone">Telefone (opcional)</label>
                    <input class="form-control" id="telefone" th:field="*{telefone}" autocomplete="tel"
                           placeholder="+258 84 000 0000"
                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="senha">Palavra-passe</label>
                    <input class="form-control" type="password" id="senha" th:field="*{senha}"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                    <div class="form-text">Minimo 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmarSenha">Repetir palavra-passe</label>
                    <input class="form-control" type="password" id="confirmarSenha" th:field="*{confirmarSenha}"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{confirmarSenha}"></div>
                </div>

                <button class="btn btn-azul w-100" type="submit">
                    <i class="bi bi-person-plus me-1"></i>Criar conta
                </button>
            </form>

            <p class="text-center small texto-suave mt-3 mb-0">
                Ja tem conta? <a class="texto-acento fw-semibold" th:href="@{/auth/login}">Entrar</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
