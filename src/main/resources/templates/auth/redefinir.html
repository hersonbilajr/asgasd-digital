<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/layout :: head('Nova palavra-passe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="auth-wrapper">
    <div class="container">
        <div class="cartao-form">
            <div class="text-center mb-4">
                <img th:src="@{/img/logo-mark.svg}" alt="Asgasd Digital" width="56" height="56" class="mb-2">
                <h1 class="h4 mb-1">Definir nova palavra-passe</h1>
            </div>

            <div class="alert alert-danger" th:if="${invalido}">
                <i class="bi bi-exclamation-triangle me-1"></i>
                Este link de recuperacao e invalido ou expirou.
                <a class="alert-link" th:href="@{/auth/recuperar}">Pedir um novo link</a>.
            </div>

            <form th:if="${!invalido}" th:action="@{/auth/redefinir}" th:object="${senhaForm}" method="post" novalidate>
                <input type="hidden" th:field="*{token}">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">Erro</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="novaSenha">Nova palavra-passe</label>
                    <input class="form-control" type="password" id="novaSenha" th:field="*{novaSenha}"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('novaSenha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{novaSenha}"></div>
                    <div class="form-text">Minimo 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmarSenha">Repetir nova palavra-passe</label>
                    <input class="form-control" type="password" id="confirmarSenha" th:field="*{confirmarSenha}"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{confirmarSenha}"></div>
                </div>
                <button class="btn btn-azul w-100" type="submit">
                    <i class="bi bi-shield-check me-1"></i>Guardar nova palavra-passe
                </button>
            </form>

            <p class="text-center small texto-suave mt-3 mb-0">
                <a class="texto-acento fw-semibold" th:href="@{/auth/login}">&larr; Voltar ao login</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
