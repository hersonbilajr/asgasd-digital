<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/admin :: head('Clientes')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin :: sidebar('clientes')}"></aside>

    <div class="admin-conteudo">
        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="admin-topo">
            <div>
                <span class="eyebrow">Comunidade</span>
                <h1>Clientes</h1>
                <p class="texto-suave small mb-0">
                    <span th:text="${pagina.totalElements}">0</span> conta(s) registada(s)
                </p>
            </div>
            <form class="d-flex gap-2" method="get" th:action="@{/admin/clientes}">
                <input class="form-control form-control-sm" type="search" name="termo"
                       placeholder="Nome ou email" th:value="${termo}">
                <button class="btn btn-sm btn-azul" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="cartao-admin">
            <div class="vazio-estado" th:if="${pagina.empty}">
                <i class="bi bi-people"></i>
                Nenhum cliente encontrado.
            </div>

            <div class="table-responsive" th:if="${!pagina.empty}">
                <table class="table tabela-admin align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Perfil</th>
                        <th>Registado em</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${pagina.content}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <span class="avatar-iniciais" th:text="${u.iniciais}">AD</span>
                                <span class="fw-semibold" th:text="${u.nome}">Nome</span>
                            </div>
                        </td>
                        <td class="small" th:text="${u.email}">Email</td>
                        <td class="small" th:text="${u.telefone} ?: '-'">Telefone</td>
                        <td>
                            <span class="badge text-bg-dark" th:if="${u.administrador}">Administrador</span>
                            <span class="badge text-bg-light" th:unless="${u.administrador}">Cliente</span>
                        </td>
                        <td class="small" th:text="${#temporals.format(u.criadoEm, 'dd/MM/yyyy')}">Data</td>
                        <td>
                            <span class="badge text-bg-success" th:if="${u.ativo}">Ativa</span>
                            <span class="badge text-bg-secondary" th:unless="${u.ativo}">Inativa</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-contorno"
                               th:href="@{/admin/clientes/{id}(id=${u.id})}">Ver ficha</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav class="mt-3" th:if="${totalPaginas > 1}">
                <ul class="pagination paginacao justify-content-center mb-0">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                        th:classappend="${i == paginaAtual} ? 'active'">
                        <a class="page-link" th:text="${i + 1}"
                           th:href="@{/admin/clientes(pagina=${i}, termo=${termo})}">1</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin :: scripts}"></div>
</body>
</html>
