spring:
  application:
    name: asgasd-digital
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/asgasd}
    username: ${DATABASE_USERNAME:asgasd}
    password: ${DATABASE_PASSWORD:asgasd}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

app:
  nome: Asgasd Digital
  moeda: MT
  # APP_BASE_URL tem prioridade; no Render cai para o RENDER_EXTERNAL_URL que a plataforma
  # injecta automaticamente (nao depende do blueprint conhecer a URL antes do primeiro deploy).
  base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  envio:
    custo: 250.00
    gratis-a-partir-de: 5000.00
  seed:
    demo: ${SEED_DEMO:true}
    admin-email: ${ADMIN_EMAIL:admin@asgasd.co.mz}
    admin-password: ${ADMIN_PASSWORD:Admin@2026}
    cliente-email: ${CLIENTE_EMAIL:cliente@exemplo.co.mz}
    cliente-password: ${CLIENTE_PASSWORD:Cliente@2026}

logging:
  level:
    root: INFO
    org.flywaydb: INFO
    com.asgasd.digital: INFO
