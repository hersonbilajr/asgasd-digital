<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/admin :: head('Produtos')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin :: sidebar('produtos')}"></aside>

    <div class="admin-conteudo">
        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="admin-topo">
            <div>
                <span class="eyebrow">Catalogo</span>
                <h1>Produtos</h1>
                <p class="texto-suave small mb-0">
                    <span th:text="${pagina.totalElements}">0</span> produto(s) registado(s)
                    &middot; <span th:text="${semStock}">0</span> sem stock
                </p>
            </div>
            <div class="d-flex gap-2">
                <form class="d-flex gap-2" method="get" th:action="@{/admin/produtos}">
                    <input class="form-control form-control-sm" type="search" name="termo"
                           placeholder="Nome ou SKU" th:value="${termo}">
                    <button class="btn btn-sm btn-azul" type="submit"><i class="bi bi-search"></i></button>
                </form>
                <a class="btn btn-acento" th:href="@{/admin/produtos/novo}">
                    <i class="bi bi-plus-lg me-1"></i>Novo produto
                </a>
            </div>
        </div>

        <div class="cartao-admin">
            <div class="vazio-estado" th:if="${pagina.empty}">
                <i class="bi bi-box"></i>
                Nenhum produto encontrado.
                <div class="mt-2"><a class="btn btn-sm btn-azul" th:href="@{/admin/produtos/novo}">Criar produto</a></div>
            </div>

            <div class="table-responsive" th:if="${!pagina.empty}">
                <table class="table tabela-admin align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>SKU</th>
                        <th class="text-end">Preco</th>
                        <th class="text-end">Stock</th>
                        <th>Estado</th>
                        <th class="text-end">Accoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pagina.content}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img class="miniatura" th:src="@{${p.imagemOuPadrao}}" th:alt="${p.nome}">
                                <div>
                                    <a class="fw-semibold" th:href="@{/produto/{slug}(slug=${p.slug})}"
                                       target="_blank" th:text="${p.nome}">Produto</a>
                                    <div class="small texto-suave" th:text="${p.descricaoCurta}">Descricao</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${p.categoria != null} ? ${p.categoria.nome} : '-'">Categoria</td>
                        <td class="small" th:text="${p.sku} ?: '-'">SKU</td>
                        <td class="text-end">
                            <span th:text="${@moeda.mt(p.precoVenda)}">0,00 MT</span>
                            <div class="small texto-suave text-decoration-line-through" th:if="${p.emPromocao}"
                                 th:text="${@moeda.mt(p.preco)}">0,00 MT</div>
                        </td>
                        <td class="text-end fw-semibold" th:text="${p.stock}">0</td>
                        <td>
                            <span class="badge text-bg-success" th:if="${p.ativo}">Ativo</span>
                            <span class="badge text-bg-secondary" th:unless="${p.ativo}">Inativo</span>
                            <span class="badge text-bg-warning text-dark ms-1" th:if="${p.destaque}">Destaque</span>
                        </td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-1">
                                <a class="btn btn-sm btn-contorno"
                                   th:href="@{/admin/produtos/{id}/editar(id=${p.id})}" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/produtos/{id}/ativar(id=${p.id})}" method="post">
                                    <button class="btn btn-sm btn-contorno" type="submit"
                                            th:title="${p.ativo} ? 'Desativar' : 'Ativar'">
                                        <i class="bi" th:classappend="${p.ativo} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </form>
                                <form th:action="@{/admin/produtos/{id}/eliminar(id=${p.id})}" method="post"
                                      data-confirmar="Eliminar este produto? Se tiver encomendas associadas, sera apenas desativado.">
                                    <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav class="mt-3" th:if="${totalPaginas > 1}">
                <ul class="pagination paginacao justify-content-center mb-0">
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                        th:classappend="${i == paginaAtual} ? 'active'">
                        <a class="page-link" th:text="${i + 1}"
                           th:href="@{/admin/produtos(pagina=${i}, termo=${termo})}">1</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div th:replace="~{fragments/admin :: scripts}"></div>
</body>
</html>
