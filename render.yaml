services:
  - type: web
    name: asgasd-digital
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render fornece a URI postgres:// completa; a aplicacao converte-a para JDBC no arranque.
      - key: DATABASE_URL
        fromDatabase:
          name: asgasd-db
          property: connectionString
      # O Render so atribui o subdominio no primeiro sync, por isso nunca se fixa a URL:
      # APP_BASE_URL recebe o RENDER_EXTERNAL_URL real (segue renomeacoes e dominios proprios).
      - key: APP_BASE_URL
        fromService:
          name: asgasd-digital
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@asgasd.co.mz
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CLIENTE_PASSWORD
        generateValue: true

databases:
  - name: asgasd-db
    databaseName: asgasd
    user: asgasd
    # Plano gratuito: sem cartao, mas a instancia expira 30 dias apos a criacao.
    plan: free
    # Flyway 10 (Spring Boot 3.3.x) ainda nao suporta PostgreSQL 18; fixar a versao 16.
    postgresMajorVersion: '16'
